spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: garagepilot-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/garagepilot}
    username: ${DATABASE_USERNAME:garagepilot}
    password: ${DATABASE_PASSWORD:garagepilot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: "${SERVER_PORT:8080}"
app:
  platform-admin-email: ${GARAGEPILOT_PLATFORM_ADMIN_EMAIL:}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-base64-value-with-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
