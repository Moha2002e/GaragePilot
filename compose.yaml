services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garagepilot}
      POSTGRES_USER: ${POSTGRES_USER:-garagepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garagepilot}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/garagepilot}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-garagepilot}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-garagepilot}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-base64-value-with-at-least-32-bytes}
    ports: ["8080:8080"]
  frontend:
    build: ./GaregePilotFront
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  postgres-data:
