spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
